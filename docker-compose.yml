services:
  python-steganographer:
    image: ${IMAGE:-ghcr.io/javidahmed64592/python-steganographer:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-steganographer
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - NGINX_PROXY_URL=${NGINX_PROXY_URL:-}
    volumes:
      - ./.env:/app/.env
      - ./logs:/app/logs
    restart: unless-stopped
